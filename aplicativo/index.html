<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca de Jogos</title>
    <script>
      window.__BJU_BOOT_STARTED_MS = performance.now()
      window.__BJU_BOOT_MARKS = [{ step: 'document.inline_script.start', elapsedMs: 0 }]
      window.requestAnimationFrame(function () {
        window.__BJU_BOOT_MARKS.push({
          step: 'document.initial_shell.painted',
          elapsedMs: Math.round(performance.now() - window.__BJU_BOOT_STARTED_MS),
        })
      })
    </script>
    <style>
      :root {
        color-scheme: dark;
        background: #0b1014;
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #0b1014;
        color: #e5f2ef;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .boot-shell {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #0b1014;
      }

      .boot-shell-panel {
        display: grid;
        gap: 14px;
        width: min(360px, calc(100vw - 48px));
      }

      .boot-shell-brand {
        color: #5eead4;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .boot-shell-title {
        color: #f5fbfa;
        font-size: 1.7rem;
        font-weight: 760;
        line-height: 1.1;
      }

      .boot-shell-bar {
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: #172229;
      }

      .boot-shell-bar span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        animation: boot-shell-progress 1.15s ease-in-out infinite;
        background: #5eead4;
      }

      @keyframes boot-shell-progress {
        0% {
          transform: translateX(-120%);
        }

        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell" aria-busy="true" aria-label="Carregando biblioteca">
        <section class="boot-shell-panel">
          <span class="boot-shell-brand">Biblioteca</span>
          <strong class="boot-shell-title">Preparando seus jogos</strong>
          <div class="boot-shell-bar" aria-hidden="true"><span></span></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
